version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: tradingcenter-db
    restart: always
    environment:
      POSTGRES_DB: tradingcenter
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_pass}
    ports:
      - "${POSTGRES_PORT:-5491}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/app.sql:/docker-entrypoint-initdb.d/init.sql

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradingcenter-api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Database=tradingcenter;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres_dev_pass}
    ports:
      - "5000:8080"
    depends_on:
      - postgres-db

  nginx-assets:
    image: nginx:alpine
    container_name: tradingcenter-assets
    restart: always
    ports:
      - "8081:80"
    volumes:
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./scripts/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
